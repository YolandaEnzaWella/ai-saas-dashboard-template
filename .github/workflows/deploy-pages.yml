# Publishes the template to GitHub Pages as a static site.
#
# One-time setup, done once by a repository admin in the browser:
#   Settings -> Pages -> Build and deployment -> Source: "GitHub Actions"
#
# The workflow cannot do this itself: creating a Pages site needs
# repository-admin rights that GITHUB_TOKEN cannot hold. Pages also has to be
# available for the repository - public on any plan, private only on a paid one.
#
# The site is then served from https://<owner>.github.io/<repo>/
name: Deploy to GitHub Pages

on:
  push:
    # Trim this list to whichever branch you publish from.
    branches:
      - main
      - claude/project-setup-docs-fua7xw
  workflow_dispatch:

# Allow the workflow to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint and typecheck
        run: |
          npm run lint
          npm run typecheck

      - name: Build static site
        env:
          NEXT_OUTPUT: export
          # A project site lives at /<repo>/, so routes and assets need that prefix.
          NEXT_BASE_PATH: /${{ github.event.repository.name }}
        run: npm run build:static

      - name: Disable Jekyll
        # Without this, Jekyll would strip the _next/ directory.
        run: touch out/.nojekyll

      # `enablement: true` is deliberately not used: creating a Pages site needs
      # repository-admin rights, which GITHUB_TOKEN cannot be granted, so it
      # fails with "Resource not accessible by integration" on public and
      # private repositories alike. Pages must be switched on once by hand.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
