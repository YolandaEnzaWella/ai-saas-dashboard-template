# Publishes the template to GitHub Pages as a static site.
#
# The build job switches Pages on itself via configure-pages `enablement: true`.
#
# That works for public repositories on any plan. GitHub Pages is available for
# private repositories only on a paid plan; on the free plan a private
# repository must be made public first, otherwise this step fails with
# "Resource not accessible by integration".
#
# The site is served from https://<owner>.github.io/<repo>/
name: Deploy to GitHub Pages

on:
  push:
    # Trim this list to whichever branch you publish from.
    branches:
      - main
      - claude/project-setup-docs-fua7xw
  workflow_dispatch:

# Allow the workflow to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint and typecheck
        run: |
          npm run lint
          npm run typecheck

      - name: Build static site
        env:
          NEXT_OUTPUT: export
          # A project site lives at /<repo>/, so routes and assets need that prefix.
          NEXT_BASE_PATH: /${{ github.event.repository.name }}
        run: npm run build:static

      - name: Disable Jekyll
        # Without this, Jekyll would strip the _next/ directory.
        run: touch out/.nojekyll

      - uses: actions/configure-pages@v5
        with:
          # Creates the Pages site through the API if it does not exist yet, so
          # no manual repository setting is needed. This needs Pages to be
          # available for the repository: public repositories on any plan,
          # private ones only on a paid plan.
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
