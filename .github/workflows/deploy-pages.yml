# Publishes the template to GitHub Pages as a static site.
#
# One-time setup, done by a repository admin:
#   Settings -> Pages -> Build and deployment -> Source: "GitHub Actions"
#
# GitHub Pages is only available for private repositories on a paid plan, so a
# private repository on the free plan has to be made public first.
#
# The site is then served from https://<owner>.github.io/<repo>/
name: Deploy to GitHub Pages

on:
  push:
    # Trim this list to whichever branch you publish from.
    branches:
      - main
      - claude/project-setup-docs-fua7xw
  workflow_dispatch:

# Allow the workflow to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint and typecheck
        run: |
          npm run lint
          npm run typecheck

      - name: Build static site
        env:
          NEXT_OUTPUT: export
          # A project site lives at /<repo>/, so routes and assets need that prefix.
          NEXT_BASE_PATH: /${{ github.event.repository.name }}
        run: npm run build:static

      - name: Disable Jekyll
        # Without this, Jekyll would strip the _next/ directory.
        run: touch out/.nojekyll

      # Note: `enablement: true` does not work here. The default GITHUB_TOKEN
      # may deploy to an existing Pages site but cannot create one, so Pages
      # has to be switched on once in the repository settings.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
